<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEM_BRIDGE_INIT</title>
</head>
<body>
<p>Deadlock Hub: storage bridge. This page keeps the mod's settings in this browser's local
storage. If the mod's "look up Steam IDs" option is on, it also asks the public service
deadlock-api.com which players were in a match (only the match number is sent). Nothing else is
sent anywhere.</p>
<script>
(function () {
    'use strict';
    // Talks to the Deadlock mod through the URL fragment (commands in) and document.title
    // (replies out). Keys outside PREFIX are refused, so the page can't be used as general storage.
    var PREFIX = 'MessageOnMatchEnd.';
    var MAX_VALUE = 4000;
    var lastQ = null;

    function reply(obj) {
        document.title = 'MEM_RES:' + JSON.stringify(obj);
    }

    // ---- match lookup (deadlock-api.com): who played which hero in a match, with Steam account IDs.
    // Only the fixed address below is ever requested, with a match number; answers are kept so the
    // same match is not asked for twice, and attempts are spaced out (the service allows few).
    var API = 'https://api.deadlock-api.com/v1/';
    var MATCH_KEY = PREFIX + 'api.match2.'; // v2: players carry their Steam name too
    var RECENT_KEY = PREFIX + 'api.recent.';
    var HERO_KEY = PREFIX + 'api.heroes';
    var TRY_KEY = PREFIX + 'api.tries';

    function readJson(key) { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; } }
    function writeJson(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }

    function getJson(url, cb) {
        var done = false;
        var finish = function (status, data) { if (!done) { done = true; cb(status, data); } };
        var ctl = typeof AbortController === 'function' ? new AbortController() : null;
        setTimeout(function () { try { if (ctl) ctl.abort(); } catch (e) {} finish(0, null); }, 12000);
        try {
            fetch(url, ctl ? { signal: ctl.signal } : undefined).then(function (res) {
                if (!res.ok) { finish(res.status, null); return; }
                res.json().then(function (data) { finish(200, data); }, function () { finish(0, null); });
            }, function () { finish(0, null); });
        } catch (e) { finish(0, null); }
    }

    function heroNames(cb) {
        var saved = readJson(HERO_KEY);
        if (saved && saved.m && Date.now() - Number(saved.t || 0) < 3 * 24 * 3600 * 1000) { cb(saved.m); return; }
        getJson(API + 'assets/heroes', function (status, list) {
            var map = {};
            if (status === 200 && list && list.length) {
                for (var i = 0; i < list.length; i += 1) {
                    if (list[i] && list[i].id != null && list[i].name) map[String(list[i].id)] = String(list[i].name);
                }
                writeJson(HERO_KEY, { t: Date.now(), m: map });
            } else if (saved && saved.m) {
                map = saved.m; // an old list is better than none
            }
            cb(map);
        });
    }

    function matchPlayers(msg) {
        var id = String(msg.id || '').replace(/\D/g, '');
        if (id.length < 4 || id.length > 12) { reply({ q: msg.q, ok: false, error: 'bad match' }); return; }
        var kept = readJson(MATCH_KEY + id);
        if (kept && kept.length) { reply({ q: msg.q, ok: true, players: kept, cached: true }); return; }
        // spacing: one try per match every 40 seconds, six tries per match at most
        var tries = readJson(TRY_KEY) || {};
        var mine = tries[id] || { n: 0, t: 0 };
        if (mine.n >= 6) { reply({ q: msg.q, ok: false, error: 'gave up' }); return; }
        if (Date.now() - mine.t < 40000) { reply({ q: msg.q, ok: false, error: 'wait' }); return; }
        var keep = {};
        var ids = Object.keys(tries).sort(function (a, b) { return tries[b].t - tries[a].t; }).slice(0, 20);
        for (var k = 0; k < ids.length; k += 1) keep[ids[k]] = tries[ids[k]];
        keep[id] = { n: mine.n + 1, t: Date.now() };
        writeJson(TRY_KEY, keep);
        getJson(API + 'matches/' + id + '/metadata', function (status, data) {
            if (status !== 200 || !data) {
                reply({ q: msg.q, ok: false, error: status === 429 ? 'rate limited' : status === 0 ? 'no answer' : 'not ready', status: status });
                return;
            }
            var info = data.match_info || data;
            var list = (info && info.players) || [];
            heroNames(function (names) {
                var out = [];
                for (var i = 0; i < list.length; i += 1) {
                    var pl = list[i] || {};
                    if (pl.account_id == null || pl.hero_id == null) continue;
                    out.push({ a: String(pl.account_id), h: String(pl.hero_id), n: names[String(pl.hero_id)] || '' });
                }
                if (!out.length) { reply({ q: msg.q, ok: false, error: 'no players' }); return; }
                // Steam names, so players can be matched by the name shown in game
                var accs = [];
                for (var j = 0; j < out.length; j += 1) accs.push(out[j].a);
                getJson(API + 'players/steam?account_ids=' + accs.join(','), function (st, profiles) {
                    if (st === 200 && profiles && profiles.length) {
                        var byAcc = {};
                        for (var x = 0; x < profiles.length; x += 1) {
                            var pr = profiles[x] || {};
                            if (pr.account_id != null && pr.personaname) byAcc[String(pr.account_id)] = String(pr.personaname).slice(0, 64);
                        }
                        for (var y = 0; y < out.length; y += 1) if (byAcc[out[y].a]) out[y].p = byAcc[out[y].a];
                    }
                    keepMatch(out);
                });
            });
        });
        function keepMatch(out) {
                writeJson(MATCH_KEY + id, out);
                // keep only the last few matches
                var order = readJson(MATCH_KEY + 'order') || [];
                order.push(id);
                while (order.length > 12) { try { localStorage.removeItem(MATCH_KEY + order.shift()); } catch (e) {} }
                writeJson(MATCH_KEY + 'order', order);
                reply({ q: msg.q, ok: true, players: out });
        }
    }

    // Rank badges (tier * 10 + subrank) for up to 50 accounts at once, kept for 3 hours.
    var RANK_KEY = PREFIX + 'api.ranks';
    function playerRanks(msg) {
        var want = String(msg.accs || '').split(',').filter(function (a) { return /^\d{1,10}$/.test(a); }).slice(0, 50);
        if (!want.length) { reply({ q: msg.q, ok: false, error: 'no accounts' }); return; }
        var kept = readJson(RANK_KEY) || {};
        var now = Date.now(), out = [], ask = [];
        for (var i = 0; i < want.length; i += 1) {
            var k = kept[want[i]];
            if (k && now - k[1] < 3 * 3600 * 1000) out.push(want[i] + ':' + k[0]); else ask.push(want[i]);
        }
        if (!ask.length) { reply({ q: msg.q, ok: true, ranks: out.join(',') }); return; }
        getJson(API + 'players/rank?account_ids=' + ask.join(','), function (status, list) {
            if (status === 200 && list && list.length) {
                for (var j = 0; j < list.length; j += 1) {
                    var e = list[j] || {};
                    if (e.account_id == null) continue;
                    var badge = Number(e.badge) || (Number(e.rank) || 0) * 10 + (Number(e.subrank) || 0);
                    kept[String(e.account_id)] = [badge, now];
                    out.push(String(e.account_id) + ':' + badge);
                }
                // keep the newest 600
                var ids = Object.keys(kept);
                if (ids.length > 600) {
                    ids.sort(function (a, b) { return kept[a][1] - kept[b][1]; });
                    for (var x = 0; x < ids.length - 600; x += 1) delete kept[ids[x]];
                }
                writeJson(RANK_KEY, kept);
            }
            if (status !== 200 && !out.length) { reply({ q: msg.q, ok: false, error: status === 429 ? 'rate limited' : 'no answer', status: status }); return; }
            reply({ q: msg.q, ok: true, ranks: out.join(',') });
        });
    }

    // A short summary of a player's recent matches (for profile pages): last 25 matches - wins,
    // losses, average kills / deaths / assists, three most played heroes. Kept for 10 minutes.
    var STATS_KEY = PREFIX + 'api.stats.';
    function playerStats(msg) {
        var acc = String(msg.acc || '').replace(/\D/g, '');
        if (acc.length < 1 || acc.length > 10) { reply({ q: msg.q, ok: false, error: 'bad account' }); return; }
        var kept = readJson(STATS_KEY + acc);
        if (kept && Date.now() - Number(kept.t || 0) < 10 * 60000) { reply({ q: msg.q, ok: true, d: kept.d, cached: true }); return; }
        getJson(API + 'players/' + acc + '/match-history', function (status, list) {
            if (status !== 200 || !list) { reply({ q: msg.q, ok: false, error: status === 429 ? 'rate limited' : status === 404 ? 'not found' : 'no answer', status: status }); return; }
            list = list.slice().sort(function (a, b) { return (Number(b.start_time) || 0) - (Number(a.start_time) || 0); }).slice(0, 25);
            if (!list.length) { reply({ q: msg.q, ok: false, error: 'not found' }); return; }
            var w = 0, l = 0, k = 0, de = 0, a = 0, heroes = {};
            for (var i = 0; i < list.length; i += 1) {
                var m = list[i] || {};
                if (Number(m.player_match_outcome) === 1) w += 1; else if (Number(m.player_match_outcome) === 2) l += 1;
                k += Number(m.player_kills) || 0; de += Number(m.player_deaths) || 0; a += Number(m.player_assists) || 0;
                var h = String(m.hero_id);
                heroes[h] = heroes[h] || [0, 0];
                heroes[h][0] += 1;
                if (Number(m.player_match_outcome) === 1) heroes[h][1] += 1;
            }
            var n = list.length;
            var one = function (x) { return Math.round(10 * x / n) / 10; };
            var top = Object.keys(heroes).sort(function (x, y) { return heroes[y][0] - heroes[x][0]; }).slice(0, 3);
            heroNames(function (names) {
                var d = { n: n, w: w, l: l, k: one(k), de: one(de), a: one(a), h: [] };
                for (var j = 0; j < top.length; j += 1) d.h.push([names[top[j]] || ('Hero ' + top[j]), heroes[top[j]][0], heroes[top[j]][1]]);
                writeJson(STATS_KEY + acc, { t: Date.now(), d: d });
                reply({ q: msg.q, ok: true, d: d });
            });
        });
    }

    // Your own recent matches (number, start time, length), so the mod can tell which match a player
    // was noted in when the game didn't show the match number. Only your own account number is sent.
    function recentMatches(msg) {
        var acc = String(msg.acc || '').replace(/\D/g, '');
        if (acc.length < 3 || acc.length > 10) { reply({ q: msg.q, ok: false, error: 'bad account' }); return; }
        var kept = readJson(RECENT_KEY + acc);
        if (kept && Date.now() - Number(kept.t || 0) < 60000) { reply({ q: msg.q, ok: true, matches: kept.m || [], cached: true }); return; }
        getJson(API + 'players/' + acc + '/match-history', function (status, list) {
            if (status !== 200 || !list) {
                reply({ q: msg.q, ok: false, error: status === 429 ? 'rate limited' : status === 0 ? 'no answer' : 'not found', status: status });
                return;
            }
            var out = [];
            for (var i = 0; i < list.length && out.length < 15; i += 1) {
                var e = list[i] || {};
                if (e.match_id == null) continue;
                out.push({ m: String(e.match_id), s: Number(e.start_time) || 0, d: Number(e.match_duration_s) || 0 });
            }
            out.sort(function (a, b) { return b.s - a.s; });
            writeJson(RECENT_KEY + acc, { t: Date.now(), m: out });
            reply({ q: msg.q, ok: true, matches: out });
        });
    }

    function handle() {
        var hash = String(location.hash || '');
        if (hash.length < 2) return;
        var msg;
        try {
            msg = JSON.parse(decodeURIComponent(hash.slice(1)));
        } catch (e) {
            return;
        }
        if (!msg || typeof msg.q !== 'string' || msg.q === lastQ) return; // never replay a command
        lastQ = msg.q;
        if (msg.f === 'match') { matchPlayers(msg); return; }
        if (msg.f === 'recent') { recentMatches(msg); return; }
        if (msg.f === 'ranks') { playerRanks(msg); return; }
        if (msg.f === 'stats') { playerStats(msg); return; }
        var key = msg.k;
        if (typeof key !== 'string' || key.indexOf(PREFIX) !== 0 || key.length > 64) {
            reply({ q: msg.q, ok: false, error: 'bad key' });
            return;
        }
        try {
            if (msg.f === 'save') {
                var value = String(msg.v);
                if (value.length > MAX_VALUE) throw new Error('value too long');
                localStorage.setItem(key, value);
                reply({ q: msg.q, ok: localStorage.getItem(key) === value });
            } else if (msg.f === 'load') {
                reply({ q: msg.q, ok: true, data: localStorage.getItem(key) });
            } else if (msg.f === 'remove') {
                localStorage.removeItem(key);
                reply({ q: msg.q, ok: true });
            } else {
                reply({ q: msg.q, ok: false, error: 'bad command' });
            }
        } catch (e) {
            reply({ q: msg.q, ok: false, error: String((e && e.message) || e) });
        }
    }

    window.addEventListener('hashchange', handle);
    // A fragment already present when the page first loads is ignored on purpose (stale command).
    document.title = 'MEM_BRIDGE_READY:v1';
})();
</script>
</body>
</html>
